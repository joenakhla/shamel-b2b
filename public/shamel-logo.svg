<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 90" fill="none">
  <!-- Circular badge icon -->
  <!-- Outer ring segments -->
  <circle cx="45" cy="45" r="43" fill="#E8F4FB"/>
  <!-- Teal arc top-left -->
  <path d="M45 2 A43 43 0 0 0 5 35" stroke="#00B4D8" stroke-width="11" fill="none" stroke-linecap="round"/>
  <!-- Blue arc right -->
  <path d="M5 55 A43 43 0 0 0 45 88" stroke="#0066CC" stroke-width="11" fill="none" stroke-linecap="round"/>
  <!-- Deep blue arc top-right -->
  <path d="M88 30 A43 43 0 0 0 60 88" stroke="#004FA3" stroke-width="11" fill="none" stroke-linecap="round"/>
  <!-- Inner white circle -->
  <circle cx="45" cy="45" r="28" fill="white"/>
  <!-- Inner icon: stylized V/health mark -->
  <path d="M30 38 L45 57 L60 38" stroke="#0066CC" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="37" y1="28" x2="37" y2="42" stroke="#00B4D8" stroke-width="5" stroke-linecap="round"/>
  <line x1="53" y1="28" x2="53" y2="42" stroke="#00B4D8" stroke-width="5" stroke-linecap="round"/>

  <!-- Text: شامل -->
  <text x="105" y="36" font-family="'Tajawal','Arial',sans-serif" font-weight="800" font-size="28" fill="#0066CC" text-anchor="middle" direction="rtl">شامل</text>
  <!-- Subtitle -->
  <text x="105" y="56" font-family="'Tajawal','Arial',sans-serif" font-weight="500" font-size="10.5" fill="#4A5568" text-anchor="middle" direction="rtl" letter-spacing="0.3">رعاية اشمل • صحة اوفر</text>
  <!-- by Yezeeta -->
  <text x="100" y="73" font-family="'Outfit','Arial',sans-serif" font-weight="400" font-size="9" fill="#94A3B8" text-anchor="middle">by</text>
  <!-- Mini V mark -->
  <rect x="112" y="62" width="18" height="18" rx="3" fill="#0066CC"/>
  <rect x="112" y="76" width="18" height="4" rx="0" fill="#E31B23"/>
  <text x="121" y="74" font-family="'Arial Black',sans-serif" font-weight="900" font-size="11" fill="white" text-anchor="middle" dominant-baseline="middle">V</text>
</svg>
